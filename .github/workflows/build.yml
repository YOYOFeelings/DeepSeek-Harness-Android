name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      snapshot_url:
        description: '快照下载地址（可选，留空则从 v1.0 release 按架构自动下载）'
        required: false
        default: ''
      version_override:
        description: '覆盖版本号（可选，格式：x.y.z；留空则自动计算）'
        required: false
        default: ''
      version_code_override:
        description: '覆盖 versionCode（可选，整数；留空则自动递增）'
        required: false
        default: ''
      apk_arch:
        description: '构建架构（workflow_dispatch 时可选：arm64 / x86_64 / all）'
        required: false
        default: 'all'
        type: choice
        options:
          - arm64
          - x86_64
          - all

permissions:
  contents: write

env:
  RELEASE_TAG: 'v1.0'
  JAVA_VERSION: '17'
  DISTRIBUTION: 'temurin'

jobs:
  # ── 阶段 1：计算版本号 + 确定矩阵配置 ─────────────────────────────────────
  version:
    name: Compute version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          PKG='app/build.gradle.kts'

          if [[ -n "${{ inputs.version_override }}" ]]; then
            VERSION_NAME="${{ inputs.version_override }}"
            # 手动指定 versionCode，否则取 gradle 当前值 +1
            if [[ -n "${{ inputs.version_code_override }}" ]]; then
              VERSION_CODE="${{ inputs.version_code_override }}"
            else
              CURRENT_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' "$PKG" | grep -oE '[0-9]+')
              VERSION_CODE=$(( CURRENT_CODE + 1 ))
            fi
            echo "手动覆盖版本: $VERSION_NAME (code=$VERSION_CODE)"
          else
            BASE_VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' "$PKG" | grep -oE '"[^"]+"' | tr -d '"')
            BASE_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' "$PKG" | grep -oE '[0-9]+')
            RECENT_TAG=$(git tag --sort=-version:refname \
              | grep -E "^v${BASE_VERSION/./\\.}" \
              | head -1 \
              || git tag --sort=-creatordate | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+" | head -1 \
              || echo "")
            if [[ -n "$RECENT_TAG" ]]; then
              COMMITS_SINCE=$(git rev-list --count "${RECENT_TAG}..HEAD")
            else
              COMMITS_SINCE=$(git rev-list --count HEAD)
            fi
            VERSION_NAME="$BASE_VERSION"
            VERSION_CODE=$(( BASE_CODE + COMMITS_SINCE ))
            echo "自动计算版本: $VERSION_NAME (code=$VERSION_CODE, 基准=$BASE_CODE, 增量=$COMMITS_SINCE, tag=$RECENT_TAG)"
          fi

          # 写回 build.gradle.kts
          sed -i \
            -e "s/versionCode\s*=\s*[0-9]\+/versionCode = ${VERSION_CODE}/" \
            -e "s/versionName\s*=\s*\"[^\"]*\"/versionName = \"${VERSION_NAME}\"/" \
            "$PKG"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Commit and push bumped version back to repo
        if: inputs.version_override == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if ! git diff --cached --quiet; then
            # [skip ci] 标记：防止自动 push 再次触发 workflow → 无限循环
            # （此前 versionCode 被自动从 19 涨到 49 就是循环的证据）
            git commit -m "chore: bump versionCode to ${{ steps.version.outputs.version_code }} (auto) [skip ci]"
            git push origin main || echo "推送失败（可能已有其他提交），跳过"
            echo "已推送 versionCode=${{ steps.version.outputs.version_code }}"
          else
            echo "版本无变化，跳过提交"
          fi

      - name: Show bumped gradle
        run: grep -n "versionCode\|versionName" app/build.gradle.kts

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}

  # ── 阶段 2：确定矩阵（在 build 之前计算）────────────────────────────────────
  matrix-setup:
    name: Setup matrix
    needs: [version]
    runs-on: ubuntu-latest
    outputs:
      archs: ${{ steps.set-matrix.outputs.archs }}
    steps:
      - name: Set matrix architectures
        id: set-matrix
        run: |
          APK_ARCH="${{ inputs.apk_arch }}"
          EVENT_NAME="${{ github.event_name }}"
          if [[ "$EVENT_NAME" == "push" ]] || [[ "$APK_ARCH" == "all" ]]; then
            echo "archs=[\"arm64\",\"x86_64\"]" >> $GITHUB_OUTPUT
            echo "构建双架构（arm64 + x86_64）"
          elif [[ "$APK_ARCH" == "arm64" ]]; then
            echo "archs=[\"arm64\"]" >> $GITHUB_OUTPUT
            echo "构建单架构：arm64"
          elif [[ "$APK_ARCH" == "x86_64" ]]; then
            echo "archs=[\"x86_64\"]" >> $GITHUB_OUTPUT
            echo "构建单架构：x86_64"
          else
            echo "archs=[\"x86_64\"]" >> $GITHUB_OUTPUT
            echo "默认构建单架构：x86_64"
          fi

  # ── 阶段 3：按架构构建 APK ────────────────────────────────────────────────
  build:
    name: Build APK (${{ matrix.arch }})
    needs: [version, matrix-setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.matrix-setup.outputs.archs) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download snapshot (${{ matrix.arch }})
        run: |
          SNAPSHOT_URL="${{ inputs.snapshot_url }}"
          if [[ -z "$SNAPSHOT_URL" ]]; then
            # 从 v1.0 release 自动下载对应架构快照
            SNAPSHOT_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/snapshot-${{ matrix.arch }}.tar.xz"
          fi
          mkdir -p app/src/main/assets
          echo "下载快照: $SNAPSHOT_URL"
          curl -L --progress-bar -o app/src/main/assets/snapshot.tar.xz "$SNAPSHOT_URL"
          echo "快照大小:"
          ls -lh app/src/main/assets/snapshot.tar.xz

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.suppressUnsupportedCompileSdk=36 \
            --no-daemon

      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find . -name "deepseek-harness-*-release.apk" | head -1)
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT
          ls -lh "${APK_PATH}"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: ${{ steps.apk.outputs.apk_path }}
          body: |
            ## ${{ needs.version.outputs.tag }} Release

            ### 📦 版本信息
            - 版本: ${{ needs.version.outputs.version_name }}
            - Build Code: ${{ needs.version.outputs.version_code }}
            - 快照: ${{ matrix.arch }}

            ### 📋 安装
            1. 下载附件中的 APK
            2. 安装并授予必要权限
            3. 首次启动需联网下载运行时快照（约 70MB）

            ### 🔧 本地构建
            \`\`\`bash
            SNAPSHOT_URL=<快照地址> ./build-and-push.sh
            \`\`\`
          draft: false
          prerelease: false
          # 同一 tag 多次上传不会冲突，会追加到已有 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-${{ needs.version.outputs.version_name }}-${{ matrix.arch }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30
