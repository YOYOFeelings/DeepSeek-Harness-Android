# 手动触发构建APK工作流
# 在GitHub仓库的Actions页面，点击"Run workflow"手动触发构建

name: Build APK

# 手动触发
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（debug/release）'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: 设置Android SDK
      uses: android-actions/setup-android@v3
    
    - name: 接受Android许可证
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --update
    
    - name: 生成Gradle Wrapper（如果不存在）
      run: |
        if [ ! -f "gradlew" ]; then
          echo "生成Gradle Wrapper..."
          gradle wrapper --gradle-version 8.10.2
        fi
        chmod +x gradlew
    
    - name: 构建APK
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
          ./gradlew assembleRelease
        else
          ./gradlew assembleDebug
        fi
    
    - name: 上传APK产物
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ github.event.inputs.build_type }}
        path: app/build/outputs/apk/**/*.apk
        retention-days: 30